<!doctype html>

<html lang="en" data-rm-theme="light">

<head>
    <meta charset="utf-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>
        Rahardianmif UI — Native Select
    </title>

    <link rel="stylesheet" href="../../src/css/rahardianmif-ui.css">

    <link rel="stylesheet" href="./form-demo.css">
</head>

<body>
    <main class="rm-demo">
        <h1>
            Rahardianmif UI Native Select
        </h1>


        <section class="rm-demo__theme" data-rm-theme="light" aria-labelledby="select-light-title">
            <h2 id="select-light-title">
                Light Theme
            </h2>

            <div class="rm-demo__form">
                <div class="rm-field">
                    <label class="rm-field__label" for="select-default">
                        Country
                    </label>

                    <div class="rm-field__control">
                        <select class="rm-select" id="select-default">
                            <option value="">
                                Select country
                            </option>

                            <option value="id">
                                Indonesia
                            </option>

                            <option value="my">
                                Malaysia
                            </option>

                            <option value="sg">
                                Singapore
                            </option>
                        </select>
                    </div>

                    <p class="rm-field__description">
                        Choose your country.
                    </p>
                </div>


                <h3>Sizes</h3>

                <div class="rm-demo__sizes">
                    <select id="select-sm" class="rm-select rm-select--sm" aria-label="Small select">
                        <option>Small</option>
                    </select>

                    <select id="select-md" class="rm-select rm-select--md" aria-label="Medium select">
                        <option>Medium</option>
                    </select>

                    <select id="select-lg" class="rm-select rm-select--lg" aria-label="Large select">
                        <option>Large</option>
                    </select>
                </div>


                <h3>States</h3>

                <div class="rm-field">
                    <label class="rm-field__label" for="select-disabled">
                        Disabled
                    </label>

                    <div class="rm-field__control">
                        <select class="rm-select" id="select-disabled" disabled>
                            <option>
                                Disabled option
                            </option>
                        </select>
                    </div>
                </div>


                <div class="rm-field">
                    <label class="rm-field__label" for="select-invalid">
                        Category
                    </label>

                    <div class="rm-field__control">
                        <select class="rm-select is-invalid" id="select-invalid" aria-invalid="true"
                            aria-describedby="select-invalid-message">
                            <option value="">
                                Select category
                            </option>

                            <option value="general">
                                General
                            </option>
                        </select>
                    </div>

                    <p class="rm-field__message" id="select-invalid-message">
                        Select a category.
                    </p>
                </div>
            </div>
        </section>


        <section class="rm-demo__theme" data-rm-theme="dark" aria-labelledby="select-dark-title">
            <h2 id="select-dark-title">
                Dark Theme
            </h2>

            <div class="rm-demo__form">
                <div class="rm-field">
                    <label class="rm-field__label" for="select-dark">
                        Country
                    </label>

                    <div class="rm-field__control">
                        <select class="rm-select" id="select-dark">
                            <option value="">
                                Select country
                            </option>

                            <option value="id">
                                Indonesia
                            </option>

                            <option value="my">
                                Malaysia
                            </option>
                        </select>
                    </div>
                </div>


                <div class="rm-field">
                    <label class="rm-field__label" for="select-dark-invalid">
                        Category
                    </label>

                    <div class="rm-field__control">
                        <select class="rm-select is-invalid" id="select-dark-invalid" aria-invalid="true"
                            aria-describedby="select-dark-invalid-message">
                            <option value="">
                                Select category
                            </option>

                            <option value="general">
                                General
                            </option>
                        </select>
                    </div>

                    <p class="rm-field__message" id="select-dark-invalid-message">
                        Select a category.
                    </p>
                </div>
            </div>
        </section>
    </main>
</body>

</html>
