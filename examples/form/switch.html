<!doctype html>

<html lang="en" data-rm-theme="light">

<head>
    <meta charset="utf-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>
        Rahardianmif UI — Switch
    </title>

    <link rel="stylesheet" href="../../src/css/rahardianmif-ui.css">

    <link rel="stylesheet" href="./form-demo.css">
</head>

<body>
    <main class="rm-demo">
        <h1>
            Rahardianmif UI Switch
        </h1>


        <section class="rm-demo__theme" data-rm-theme="light" aria-labelledby="switch-light-title">
            <h2 id="switch-light-title">
                Light Theme
            </h2>

            <div class="rm-demo__form">
                <label class="rm-switch-field">
                    <input id="switch-default" class="rm-switch" type="checkbox">

                    <span class="rm-switch__track" aria-hidden="true">
                        <span class="rm-switch__thumb"></span>
                    </span>

                    <span class="rm-switch__label">
                        Enable notifications
                    </span>
                </label>


                <label class="rm-switch-field">
                    <input id="switch-checked" class="rm-switch" type="checkbox" checked>

                    <span class="rm-switch__track" aria-hidden="true">
                        <span class="rm-switch__thumb"></span>
                    </span>

                    <span class="rm-switch__label">
                        Automatic updates
                    </span>
                </label>


                <label class="rm-switch-field">
                    <input id="switch-description" class="rm-switch" type="checkbox"
                        aria-describedby="switch-description-text">

                    <span class="rm-switch__track" aria-hidden="true">
                        <span class="rm-switch__thumb"></span>
                    </span>

                    <span class="rm-switch__label">
                        Analytics
                    </span>

                    <span class="rm-switch__description" id="switch-description-text">
                        Allow anonymous usage analytics.
                    </span>
                </label>


                <h3>Sizes</h3>

                <label class="rm-switch-field rm-switch-field--sm">
                    <input id="switch-sm" class="rm-switch" type="checkbox" checked>

                    <span class="rm-switch__track" aria-hidden="true">
                        <span class="rm-switch__thumb"></span>
                    </span>

                    <span class="rm-switch__label">
                        Small
                    </span>
                </label>


                <label class="rm-switch-field rm-switch-field--md">
                    <input id="switch-md" class="rm-switch" type="checkbox" checked>

                    <span class="rm-switch__track" aria-hidden="true">
                        <span class="rm-switch__thumb"></span>
                    </span>

                    <span class="rm-switch__label">
                        Medium
                    </span>
                </label>


                <label class="rm-switch-field rm-switch-field--lg">
                    <input id="switch-lg" class="rm-switch" type="checkbox" checked>

                    <span class="rm-switch__track" aria-hidden="true">
                        <span class="rm-switch__thumb"></span>
                    </span>

                    <span class="rm-switch__label">
                        Large
                    </span>
                </label>


                <h3>States</h3>

                <label class="rm-switch-field">
                    <input id="switch-disabled" class="rm-switch" type="checkbox" disabled>

                    <span class="rm-switch__track" aria-hidden="true">
                        <span class="rm-switch__thumb"></span>
                    </span>

                    <span class="rm-switch__label">
                        Disabled
                    </span>
                </label>


                <label class="rm-switch-field is-invalid">
                    <input id="switch-invalid" class="rm-switch" type="checkbox" aria-invalid="true"
                        aria-describedby="switch-invalid-message">

                    <span class="rm-switch__track" aria-hidden="true">
                        <span class="rm-switch__thumb"></span>
                    </span>

                    <span class="rm-switch__label">
                        Required setting
                    </span>

                    <span class="rm-switch__description" id="switch-invalid-message">
                        This setting must be enabled.
                    </span>
                </label>
            </div>
        </section>


        <section class="rm-demo__theme" data-rm-theme="dark" aria-labelledby="switch-dark-title">
            <h2 id="switch-dark-title">
                Dark Theme
            </h2>

            <div class="rm-demo__form">
                <label class="rm-switch-field">
                    <input class="rm-switch" type="checkbox">

                    <span class="rm-switch__track" aria-hidden="true">
                        <span class="rm-switch__thumb"></span>
                    </span>

                    <span class="rm-switch__label">
                        Dark unchecked
                    </span>
                </label>


                <label class="rm-switch-field">
                    <input class="rm-switch" type="checkbox" checked>

                    <span class="rm-switch__track" aria-hidden="true">
                        <span class="rm-switch__thumb"></span>
                    </span>

                    <span class="rm-switch__label">
                        Dark checked
                    </span>
                </label>
            </div>
        </section>
    </main>
</body>

</html>
